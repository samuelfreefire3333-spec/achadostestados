html{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: vitrine em grade de cards sobre fundo frio; demonstração abre como folha (celular) ou painel em duas colunas (desktop). */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EAEEF5; --ink:#141B2D; --muted:#5A6378; --line:#DCE2EC;
  --accent:#2F6FE0; --accent-ink:#FFFFFF; --buy:#3483FA; --buy-hover:#2968C8;
  --seal:#FFE600; --seal-ink:#2D3277;
  --good:#0E8A4F; --good-bg:#E5F5EC; --warn:#B85A06; --warn-bg:#FDF0E2; --note-bg:#FFFBE0; --note-line:#E8D44A;
  --star:#F2A60C; --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.07);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#151C2D; --surface-2:#1C2539; --ink:#E7EBF3; --muted:#98A2B7; --line:#26304A;
  --accent:#6EA2FF; --accent-ink:#0D1220; --buy:#3483FA; --buy-hover:#4C93FF;
  --seal:#FFE600; --seal-ink:#2D3277;
  --good:#45D18F; --good-bg:#12291F; --warn:#FFAA5C; --warn-bg:#2E2010; --note-bg:#262311; --note-line:#6D6320;
  --star:#FFC23D; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2D; --surface-2:#1C2539; --ink:#E7EBF3; --muted:#98A2B7; --line:#26304A;
  --accent:#6EA2FF; --accent-ink:#0D1220; --buy:#3483FA; --buy-hover:#4C93FF;
  --seal:#FFE600; --seal-ink:#2D3277;
  --good:#45D18F; --good-bg:#12291F; --warn:#FFAA5C; --warn-bg:#2E2010; --note-bg:#262311; --note-line:#6D6320;
  --star:#FFC23D; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:12px;align-items:center;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand-mark{width:34px;height:34px;display:block;flex:none}.brand-mark svg{display:block}
.brand b{font:700 19px var(--f-display);letter-spacing:-.02em}

footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px}

.ext-link{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;margin-top:8px}

.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:24px 1fr 28px;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.bar i{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:block}

@media(min-width:900px){.rv-cols{grid-template-columns:360px 1fr}}

.hp{position:absolute;left:-9999px}
.rv-list{display:grid;gap:12px;align-content:start}

.rv-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rv-top b{color:var(--ink);font-size:14px}
.rv p{margin:0;overflow-wrap:anywhere}
.rv-help{background:none;border:1px solid var(--line);border-radius:999px;font-size:12.5px;padding:4px 10px;cursor:pointer;justify-self:start;color:var(--muted)}

.verified{color:var(--good);font-weight:700;font-size:12px}

.sticky-buy{position:sticky;bottom:0;z-index:3;display:flex;gap:12px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}

.sticky-buy .btn{flex:1}

/* Admin */
.admin{padding-block:24px 60px;display:grid;gap:20px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;flex:none}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.form-grid{display:grid;gap:14px;grid-template-columns:1fr}

.prev-imgs{display:flex;gap:8px;flex-wrap:wrap}
.prev-imgs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface-2)}

.pill.publicado{background:var(--good-bg);color:var(--good)}

.gate{max-width:380px;margin:40px auto}

/* Veredito: Aprovados / Intermediários / Ruins */
:root{--ok:#0E8A4F;--ok-bg:#E3F4EA;--mid:#B07800;--mid-bg:#FFF4D6;--bad:#C8372D;--bad-bg:#FCE6E3}

.v-ok{--v:var(--ok);--vbg:var(--ok-bg)}.v-mid{--v:var(--mid);--vbg:var(--mid-bg)}.v-bad{--v:var(--bad);--vbg:var(--bad-bg)}

<script>
"use strict";
/* =====================================================================
   ACHADOS TESTADOS — Vitrine de afiliado Mercado Livre
   Módulos (nesta ordem): CONFIG · SEGURANÇA · DADOS DE EXEMPLO ·

/* ---------- SEGURANÇA ----------
   Regra de ouro: nenhum dado digitado (por você ou por visitantes) vira HTML.
   Tudo entra no DOM via textContent / setAttribute, e URLs passam por safeUrl(). */
const SAFE_URL_RE = /^(https?:|data:image\/(png|jpe?g|webp|gif|svg\+xml);|data:video\/(mp4|webm);|blob:|#)/i;
function safeUrl(raw, { httpsOnly = false, allowData = true } = {}) {
  if (typeof raw !== "string") return "";
  const u = raw.trim();
  if (!u) return "";
  if (u.startsWith("data:")) return allowData && SAFE_URL_RE.test(u) ? u : "";
  try {
    const p = new URL(u);
    if (httpsOnly ? p.protocol !== "https:" : !/^https?:$/.test(p.protocol)) return "";
    return p.href;
  } catch { return ""; }
}
function isMercadoLivre(url) {
  try { const h = new URL(url).hostname; return /(^|\.)mercadoli(vre|bre)\.(com\.br|com|com\.ar|com\.mx)$/.test(h) || /(^|\.)meli\.la$/.test(h) || /(^|\.)mercadolivre\.com$/.test(h); }
  catch { return false; }
}
const clean = (s, max = 2000) => String(s ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F‪-‮]/g, "").trim().slice(0, max);
const lines = (s, maxItem = 300) => String(s ?? "").split("\n").map(x => clean(x, maxItem)).filter(Boolean);
const hasLink = s => /(https?:\/\/|www\.|\b[\w-]+\.(com|br|net|org|ly|io|me|la)\b)/i.test(s);
async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

const LocalStorageStore = (() => {
  const K = { p: "at_products_v3", r: "at_reviews_v3", s: "at_settings_v1", seed: "at_seed_ids_v3" };
  const mem = {};
  const read = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return mem[k] ?? def; } };
  const write = (k, v) => { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  function seedIfEmpty() {
    if (read(K.p, null) === null) {
      write(K.p, SEED);
      write(K.r, SEED_REVIEWS.map((r, i) => ({ ...r, id: uid("r"), status: "publicado", criadoEm: Date.now() - 864e5 * (i + 1) })));
      write(K.seed, SEED.map(p => p.id));

    // Produtos novos publicados no código aparecem também para quem já visitou o site
    const aplicados = read(K.seed, null) || read(K.p, []).map(p => p.id);
    const novos = SEED.filter(p => !aplicados.includes(p.id));
    if (novos.length) write(K.p, [...novos, ...read(K.p, [])]);
    write(K.seed, [...new Set([...aplicados, ...SEED.map(p => p.id)])]);
  }
  seedIfEmpty();
  return {
    async listProducts() { return read(K.p, []); },
    async getProduct(id) { return read(K.p, []).find(p => p.id === id) || null; },
    async saveProduct(prod) { const all = read(K.p, []); const i = all.findIndex(p => p.id === prod.id); i >= 0 ? all[i] = prod : all.unshift(prod); write(K.p, all); return prod; },
    async deleteProduct(id) { write(K.p, read(K.p, []).filter(p => p.id !== id)); write(K.r, read(K.r, []).filter(r => r.produtoId !== id)); },

})();
/* API do servidor (Cloudflare Pages Functions + banco D1).
   Se a API não existir (ex.: prévia local), o site volta a usar o navegador. */
const Api = {
  async call(path, opts = {}) {
    let r;
    try { r = await fetch(path, { ...opts, headers: { "content-type": "application/json", ...(opts.headers || {}) } }); }
    catch { return { indisponivel: true }; }
    const tipo = r.headers.get("content-type") || "";
    if (!tipo.includes("application/json")) return { indisponivel: true };
    const body = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, body };
  }
};
const Store = {
  ...LocalStorageStore,
  async listReviews(produtoId, opts = {}) {
    if (opts.incluirOcultas) return LocalStorageStore.listReviews(produtoId, opts);
    const r = await Api.call("/api/avaliacoes" + (produtoId ? "?produto=" + encodeURIComponent(produtoId) : ""));
    if (r.ok && Array.isArray(r.body.avaliacoes)) return r.body.avaliacoes;
    return LocalStorageStore.listReviews(produtoId, opts);
  },
  async addReview(rv) {
    const r = await Api.call("/api/avaliacoes", { method: "POST", body: JSON.stringify(rv) });
    if (r.indisponivel) return LocalStorageStore.addReview(rv);
    if (!r.ok) throw new Error(r.body.erro || "Não consegui publicar agora.");
    return r.body.avaliacao;
  },
  async updateReview(id, patch) {
    if ("util" in patch && Object.keys(patch).length === 1) {
      const r = await Api.call("/api/avaliacoes/util", { method: "POST", body: JSON.stringify({ id }) });
      if (!r.indisponivel) return { id, util: r.body.util };
    }
    return LocalStorageStore.updateReview(id, patch);
  }
};

function normalizeProduct(p) {

  return {
    id: clean(p.id, 80) || slug(nome) + "-" + uid().slice(0, 4),
    nome, categoria: clean(p.categoria, 40) || "Outros",

    criadoEm: Number(p.criadoEm) || Date.now()

}

function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if ((k === "href" || k === "src") && !SAFE_URL_RE.test(String(v))) continue; // bloqueia javascript: etc.
    else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}

/* Vídeo: reconhece .mp4/.webm, YouTube (inclusive Shorts), TikTok e Instagram (post/reel) */
function parseVideo(url) {
  const u = safeUrl(url); if (!u) return null;
  if (/^data:video\//.test(u) || /\.(mp4|webm|mov)(\?|#|$)/i.test(u)) return { tipo: "arquivo", src: u };
  let m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/)))
    return { tipo: "youtube", embed: `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&playsinline=1`, link: `https://www.youtube.com/watch?v=${m[1]}`, rotulo: "YouTube", vertical: /shorts\//.test(u) };
  if ((m = u.match(/tiktok\.com\/@[\w.-]+\/video\/(\d+)/)))
    return { tipo: "tiktok", embed: `https://www.tiktok.com/embed/v2/${m[1]}`, link: u, rotulo: "TikTok", vertical: true };
  if ((m = u.match(/instagram\.com\/(?:p|reel|reels|tv)\/([\w-]+)/)))
    return { tipo: "instagram", embed: `https://www.instagram.com/p/${m[1]}/embed`, link: u, rotulo: "Instagram", vertical: true };
  return { tipo: "link", link: u, rotulo: "vídeo" };
}

/* Preço automático: para produtos com código de catálogo, busca o preço atual no ML (cache de 6 h no servidor).

async function atualizaPrecos() {
  if (atualizaPrecos.feito) return; atualizaPrecos.feito = true;
  const alvos = state.produtos.filter(p => p.mlCatalogo);
  const resultados = await Promise.all(alvos.map(async p => {
    const r = await Api.call("/api/ml-produto?catalogo=" + encodeURIComponent(p.mlCatalogo));
    if (!r.ok || typeof r.body.preco !== "number") return false;
    const novo = { ...p, preco: r.body.preco, precoAntigo: typeof r.body.precoAntigo === "number" && r.body.precoAntigo > r.body.preco ? r.body.precoAntigo : null, precoConsultadoEm: r.body.consultadoEm };
    await Store.saveProduct(novo);
    Object.assign(p, novo);
    return true;
  }));
  if (resultados.some(Boolean) && renderVitrine.refresh) renderVitrine.refresh();
}

/* ---------- PAINEL ADMIN ----------
   Separado da vitrine: só é montado em #admin e depois do PIN.
   ATENÇÃO: PIN no navegador é só para a demonstração. Proteção real = login Firebase + regras do Firestore. */
const admin = { ok: sessionStorageGet("at_admin") === "1", tab: "produtos", editando: null };
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch { return null; } }
function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch {} }

async function renderAdmin() {
  const app = document.getElementById("app");
  closeProduct(false);
  if (!admin.ok) {
    const pin = h("input", { id: "pin", type: "password", inputmode: "numeric", autocomplete: "current-password" });
    const err = h("div", { class: "err", role: "alert" });
    app.replaceChildren(h("div", { class: "wrap" }, h("form", { class: "panel gate", onsubmit: async e => {
      e.preventDefault();
      if (await sha256(pin.value) === CONFIG.adminPinHash) { admin.ok = true; sessionStorageSet("at_admin", "1"); renderAdmin(); }
      else { err.textContent = "PIN incorreto."; pin.value = ""; pin.focus(); }
    } },
      h("h2", { style: "font-size:22px" }, "Painel do administrador"),
      h("p", { class: "hint" }, "PIN de demonstração: 1234. No site publicado, este acesso passa a ser login com e-mail e senha (Firebase)."),
      h("div", { class: "field" }, h("label", { for: "pin" }, "PIN"), pin), err,
      h("button", { class: "btn btn-buy", type: "submit" }, "Entrar"),
      h("a", { href: "#", class: "hint" }, "Voltar para a vitrine"))));
    pin.focus(); return;
  }
  const tabs = [["produtos", "Produtos"], ["form", admin.editando ? "Editar produto" : "Novo produto"], ["avaliacoes", "Avaliações"], ["backup", "Backup e config."]];
  const body = h("div");
  app.replaceChildren(h("div", { class: "wrap admin" },
    h("div", { class: "admin-head" }, h("h1", { style: "font-size:28px" }, "Painel do administrador"),
      h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" },
        h("a", { class: "btn", href: "#" }, "Ver vitrine"),
        h("button", { class: "btn btn-ghost", type: "button", onclick: () => { admin.ok = false; sessionStorageSet("at_admin", ""); location.hash = ""; } }, "Sair"))),
    h("div", { class: "tabs", role: "tablist" }, tabs.map(([k, t]) => h("button", { class: "tab", role: "tab", type: "button", "aria-selected": String(admin.tab === k), onclick: () => { if (k !== "form") admin.editando = null; admin.tab = k; renderAdmin(); } }, t))),
    body));
  if (admin.tab === "produtos") body.append(await adminLista());
  if (admin.tab === "form") body.append(await adminForm());
  if (admin.tab === "avaliacoes") body.append(await adminAvaliacoes());
  if (admin.tab === "backup") body.append(await adminBackup());
}

function twoStep(label, onConfirm) { // confirmação dentro da página (sem confirm())
  const b = h("button", { class: "btn", type: "button" }, label);
  let armed = false, t;
  b.addEventListener("click", () => {
    if (!armed) { armed = true; b.textContent = "Confirmar?"; b.className = "btn btn-danger"; t = setTimeout(() => { armed = false; b.textContent = label; b.className = "btn"; }, 4000); }
    else { clearTimeout(t); onConfirm(); }
  });
  return b;
}

  out.value = JSON.stringify(await Store.exportAll(), null, 2);
  const inn = h("textarea", { id: "bkIn", class: "code", placeholder: "Cole aqui um JSON exportado antes" });
  const err = h("div", { class: "err", role: "alert" });
  const mod = h("input", { type: "checkbox", id: "cfgMod", checked: !!s.moderarAntes, onchange: async e => { await Store.saveSettings({ ...s, moderarAntes: e.target.checked }); toast(e.target.checked ? "Novas avaliações esperam sua aprovação." : "Novas avaliações publicam na hora."); } });
  return h("div", { style: "display:grid;gap:16px" },
    h("div", { class: "panel" }, h("h2", { style: "font-size:20px" }, "Avaliações"),

      h("span", { class: "hint" }, "Copie e guarde. Esse JSON também serve para subir os produtos no Firebase."), out,
      h("button", { class: "btn", type: "button", onclick: async () => { try { await navigator.clipboard.writeText(out.value); toast("JSON copiado."); } catch { out.select(); toast("Selecionado. Use Ctrl+C / Copiar."); } } }, "Copiar JSON")),
    h("div", { class: "panel" }, h("h2", { style: "font-size:20px" }, "Importar dados"), inn, err,

        h("button", { class: "btn btn-buy", type: "button", onclick: async () => { err.textContent = ""; try { await Store.importAll(JSON.parse(inn.value)); toast("Dados importados."); admin.tab = "produtos"; renderAdmin(); } catch (x) { err.textContent = "Não consegui importar: " + (x.message || "JSON inválido"); } } }, "Importar e substituir"),

/* ---------- ROTEADOR ---------- */
async function route() {
  const hsh = location.hash;
  if (hsh === "#admin") return renderAdmin();
  if (!document.querySelector(".grid")) await renderVitrine();
  if (hsh.startsWith("#p-")) openProduct(hsh.slice(3), { pushHash: false });
  else closeProduct(false);
}
window.addEventListener("hashchange", () => { if (location.hash !== "#admin" && document.querySelector(".admin")) { document.getElementById("app").replaceChildren(); } route(); });
document.getElementById("sugLink").addEventListener("click", e => { e.preventDefault(); if (document.querySelector('.admin')) { history.replaceState(null, '', location.pathname); document.getElementById('app').replaceChildren(); } route().then(() => document.getElementById('sugerir')?.scrollIntoView({ behavior: 'smooth' })); });
document.getElementById("adminLink").addEventListener("click", () => { location.hash = "admin"; window.scrollTo(0, 0); });
document.getElementById("brandLink").addEventListener("click", e => { e.preventDefault(); history.replaceState(null, "", location.pathname + location.search); if (document.querySelector(".admin")) document.getElementById("app").replaceChildren(); route(); });
let qT; document.getElementById("q").addEventListener("input", e => {
  clearTimeout(qT); qT = setTimeout(async () => {
    state.q = clean(e.target.value, 80);
    if (location.hash === "#admin") { history.replaceState(null, "", location.pathname); document.getElementById("app").replaceChildren(); }
    if (!document.querySelector(".grid")) await renderVitrine();
    renderVitrine.refresh();
  }, 120);
});
