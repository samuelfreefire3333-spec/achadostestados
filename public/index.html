html{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: vitrine em grade de cards sobre fundo frio; demonstração abre como folha (celular) ou painel em duas colunas (desktop). */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EAEEF5; --ink:#141B2D; --muted:#5A6378; --line:#DCE2EC;
  --accent:#2F6FE0; --accent-ink:#FFFFFF; --buy:#3483FA; --buy-hover:#2968C8;
  --seal:#FFE600; --seal-ink:#2D3277;
  --good:#0E8A4F; --good-bg:#E5F5EC; --warn:#B85A06; --warn-bg:#FDF0E2; --note-bg:#FFFBE0; --note-line:#E8D44A;
  --star:#F2A60C; --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.07);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#151C2D; --surface-2:#1C2539; --ink:#E7EBF3; --muted:#98A2B7; --line:#26304A;
  --accent:#6EA2FF; --accent-ink:#0D1220; --buy:#3483FA; --buy-hover:#4C93FF;
  --seal:#FFE600; --seal-ink:#2D3277;
  --good:#45D18F; --good-bg:#12291F; --warn:#FFAA5C; --warn-bg:#2E2010; --note-bg:#262311; --note-line:#6D6320;
  --star:#FFC23D; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2D; --surface-2:#1C2539; --ink:#E7EBF3; --muted:#98A2B7; --line:#26304A;
  --accent:#6EA2FF; --accent-ink:#0D1220; --buy:#3483FA; --buy-hover:#4C93FF;
  --seal:#FFE600; --seal-ink:#2D3277;
  --good:#45D18F; --good-bg:#12291F; --warn:#FFAA5C; --warn-bg:#2E2010; --note-bg:#262311; --note-line:#6D6320;
  --star:#FFC23D; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:12px;align-items:center;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}

/* ---------- STORE ----------
   Interface única usada pelo site. Hoje: LocalStorageStore (teste imediato).
   Para produção: troque por FirebaseStore (arquivo store-firebase.js) mantendo os MESMOS métodos.
   Todos os métodos são async para a troca ser transparente. */
const LocalStorageStore = (() => {
  const K = { p: "at_products_v2", r: "at_reviews_v2", s: "at_settings_v1" };
  const mem = {};
  const read = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return mem[k] ?? def; } };
  const write = (k, v) => { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  function seedIfEmpty() {
    if (read(K.p, null) === null) {
      write(K.p, SEED);
      write(K.r, SEED_REVIEWS.map((r, i) => ({ ...r, id: uid("r"), status: "publicado", criadoEm: Date.now() - 864e5 * (i + 1) })));
    }
  }
  seedIfEmpty();
  return {
    async listProducts() { return read(K.p, []); },
    async getProduct(id) { return read(K.p, []).find(p => p.id === id) || null; },
    async saveProduct(prod) { const all = read(K.p, []); const i = all.findIndex(p => p.id === prod.id); i >= 0 ? all[i] = prod : all.unshift(prod); write(K.p, all); return prod; },
    async deleteProduct(id) { write(K.p, read(K.p, []).filter(p => p.id !== id)); write(K.r, read(K.r, []).filter(r => r.produtoId !== id)); },
    async listReviews(produtoId, { incluirOcultas = false } = {}) {
      return read(K.r, []).filter(r => (!produtoId || r.produtoId === produtoId) && (incluirOcultas || r.status === "publicado")).sort((a, b) => b.criadoEm - a.criadoEm);
    },
    async addReview(rv) { const all = read(K.r, []); all.push(rv); write(K.r, all); return rv; },
    async updateReview(id, patch) { const all = read(K.r, []); const r = all.find(x => x.id === id); if (r) Object.assign(r, patch); write(K.r, all); return r; },
    async deleteReview(id) { write(K.r, read(K.r, []).filter(r => r.id !== id)); },
    async getSettings() { return read(K.s, { moderarAntes: false }); },
    async saveSettings(s) { write(K.s, s); },
    async exportAll() { return { versao: 1, exportadoEm: new Date().toISOString(), produtos: read(K.p, []), avaliacoes: read(K.r, []), config: read(K.s, {}) }; },
    async importAll(data) {
      if (!data || !Array.isArray(data.produtos)) throw new Error("JSON sem a lista \"produtos\".");
      write(K.p, data.produtos.map(normalizeProduct).filter(Boolean));
      if (Array.isArray(data.avaliacoes)) write(K.r, data.avaliacoes);
    },
    async resetDemo() { try { Object.values(K).forEach(k => localStorage.removeItem(k)); } catch {} Object.keys(mem).forEach(k => delete mem[k]); seedIfEmpty(); }
  };
})();
const Store = LocalStorageStore;   // <- troque aqui por FirebaseStore em produção

/* Garante formato e limpa qualquer produto (vale para cadastro e importação) */
function normalizeProduct(p) {
  if (!p || typeof p !== "object") return null;
  const nome = clean(p.nome, 140); if (!nome) return null;
  const num = v => { const n = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(/\./g, "").replace(",", ".")); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null; };
  const arr = (v, max) => (Array.isArray(v) ? v : lines(v)).map(x => clean(x, max)).filter(Boolean).slice(0, 20);
  return {
    id: clean(p.id, 80) || slug(nome) + "-" + uid().slice(0, 4),
    nome, categoria: clean(p.categoria, 40) || "Outros",
    preco: num(p.preco), precoAntigo: num(p.precoAntigo),
    maisVendido: !!p.maisVendido, selo: CONFIG.selos.includes(p.selo) ? p.selo : "",
    veredito: CONFIG.vereditos[p.veredito] ? p.veredito : "aprovado", motivoVeredito: clean(p.motivoVeredito, 240),
    link: safeUrl(p.link, { httpsOnly: true, allowData: false }),
    imagens: arr(p.imagens, 3_000_000).map(u => safeUrl(u)).filter(Boolean).slice(0, 12),
    video: safeUrl(p.video) || "",
    observacoes: clean(p.observacoes, 4000), indicadoPara: clean(p.indicadoPara, 300),
    pros: arr(p.pros, 200), contras: arr(p.contras, 200), specs: arr(p.specs, 200),
    criadoEm: Number(p.criadoEm) || Date.now()

function twoStep(label, onConfirm) { // confirmação dentro da página (sem confirm())
  const b = h("button", { class: "btn", type: "button" }, label);
  let armed = false, t;
  b.addEventListener("click", () => {
    if (!armed) { armed = true; b.textContent = "Confirmar?"; b.className = "btn btn-danger"; t = setTimeout(() => { armed = false; b.textContent = label; b.className = "btn"; }, 4000); }
    else { clearTimeout(t); onConfirm(); }
  });
  return b;
}

async function route() {
  const hsh = location.hash;
  if (hsh === "#admin") return renderAdmin();
  if (!document.querySelector(".grid")) await renderVitrine();
  if (hsh.startsWith("#p-")) openProduct(hsh.slice(3), { pushHash: false });
  else closeProduct(false);
}
window.addEventListener("hashchange", () => { if (location.hash !== "#admin" && document.querySelector(".admin")) { document.getElementById("app").replaceChildren(); } route(); });
document.getElementById("adminLink").addEventListener("click", () => { location.hash = "admin"; window.scrollTo(0, 0); });
document.getElementById("brandLink").addEventListener("click", e => { e.preventDefault(); history.replaceState(null, "", location.pathname + location.search); if (document.querySelector(".admin")) document.getElementById("app").replaceChildren(); route(); });
let qT; document.getElementById("q").addEventListener("input", e => {
  clearTimeout(qT); qT = setTimeout(async () => {
    state.q = clean(e.target.value, 80);
    if (location.hash === "#admin") { history.replaceState(null, "", location.pathname); document.getElementById("app").replaceChildren(); }
    if (!document.querySelector(".grid")) await renderVitrine();
    renderVitrine.refresh();
  }, 120);
});
/* Links das redes (cabeçalho e rodapé) */
function socialLinks() {
  return [
    h("a", { class: "ml", href: CONFIG.perfilML, target: "_blank", rel: "noopener noreferrer", title: "Minha vitrine no Mercado Livre" }, icon("cart", 16), h("span", {}, "Minha vitrine no ML")),
    h("a", { href: CONFIG.tiktok, target: "_blank", rel: "noopener noreferrer", title: "TikTok " + CONFIG.tiktokUser }, icon("note", 16), h("span", {}, CONFIG.tiktokUser))
  ];
}
document.getElementById("social").replaceChildren(...socialLinks());
document.getElementById("socialFoot").replaceChildren(...socialLinks());
route();
</script>
